name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - 'index.html'
      - 'package.json'
      - 'src/**'
      - 'vite.config.ts'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.apps) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'web/${{ matrix.app }}/package-lock.json'

      - name: Install dependencies
        working-directory: web/${{ matrix.app }}
        run: npm ci

      - name: Verify TypeScript and build SPA
        working-directory: web/${{ matrix.app }}
        env:
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.DEV_OAUTH_CLIENT_ID }}
        run: npm run build

      - name: Run unit tests
        working-directory: web/${{ matrix.app }}
        run: npm test

  deploy-staging:
    name: Deploy to Firebase Staging
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: "write"
      checks: "write"
      contents: "read"
      id-token: "write"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        id: "auth"
        uses: google-github-actions/auth@v3
        with:
          token_format: "access_token"
          workload_identity_provider: ${{ secrets.FIREBASE_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Stage to Firebase
        uses: minherz/firebase-hosting-deploy@v2
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ steps.auth.outputs.credentials_file_path }}"
          expires: "7d"
          entryPoint: ./deploy/firebase
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
