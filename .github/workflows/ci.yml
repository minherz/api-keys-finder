name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - 'web/*/**'
    paths-ignore:
      - '**/README.md'

jobs:
  detect-changes:
    name: Detect changed Web apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.set-apps.outputs.apps }}
    steps:
    - name: Checkout changes (in-depth)
      uses: actions/checkout@v6
      with:
        fetch-depth: 0 # need for diff calculation on multi-commit PRs
    - name: Find changed applications
      id: set-apps
      run: |
        # Determine reference commit based on event type
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_REF="origin/${{ github.base_ref }}"
        else
          BASE_REF="HEAD~1"
        fi

        # Extract unique first-level folder names under web/
        # Example: web/app1/src/index.ts -> app1
        DIRS=$(git diff --name-only "$BASE_REF" HEAD | grep '^web/.*\/.\+' | cut -d'/' -f2 | tr ' ' '\n' | sort -u | grep -v '^$' || true)

        # Format unique directories into a JSON array: ["app1", "app2"]
        JSON_ARRAY=$(echo "$DIRS" | jq -R . | jq -s -c .)

        echo "Detected changed web app directories: $JSON_ARRAY"
        echo "apps=$JSON_ARRAY" >> $GITHUB_OUTPUT

  build-and-test:
    needs: detect-changes
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.apps) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'web/${{ matrix.app }}/package-lock.json'

      - name: Install dependencies
        working-directory: web/${{ matrix.app }}
        run: npm ci

      - name: Verify TypeScript and build SPA
        working-directory: web/${{ matrix.app }}
        env:
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.DEV_OAUTH_CLIENT_ID }}
        run: npm run build

      - name: Run unit tests
        working-directory: web/${{ matrix.app }}
        run: npm test

      - name: Prepare Artifact Upload
        working-directory: 
        run: mv web/${{ matrix.app }}/dist ${{ matrix.app }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-build-${{ matrix.app }}
          path: ${{ matrix.app }}
          retention-days: 1

  deploy-staging:
    needs: [detect-changes, build-and-test]
    name: Deploy to Firebase Staging
    runs-on: ubuntu-latest
    permissions:
      pull-requests: "write"
      checks: "write"
      contents: "read"
      id-token: "write"
    # Run only if we successfully detected changes and built them
    if: ${{ needs.detect-changes.outputs.apps != '[]' && needs.detect-changes.outputs.apps != '' }}
    steps:
      - name: Checkout deploy folder
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            deploy

      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          pattern: app-build-*
          merge-multiple: true

      # Deploy to Firebase Staging ---
      - name: Authenticate to Google Cloud
        id: "auth"
        uses: google-github-actions/auth@v3
        with:
          token_format: "access_token"
          workload_identity_provider: ${{ secrets.FIREBASE_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Stage to Firebase
        uses: minherz/firebase-hosting-deploy@v2
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ steps.auth.outputs.credentials_file_path }}"
          expires: "7d"
          entryPoint: ./deploy/firebase
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
