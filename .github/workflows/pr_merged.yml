name: Deploy on PR Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - 'index.html'
      - 'package.json'
      - 'src/**'
      - 'vite.config.ts'
      - 'vitest.config.ts'
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0    # fetch all history
          filter: blob:none # exclude file contents for faster checkout

      - name: Calculate Semantic Version
        id: semver
        uses: paulhatch/semantic-version@9f72830310d5ed81233b641ee59253644cd8a8fc # v6.0.2
        with:
          tag_prefix: "v"
          minor_pattern: "feat:"
          version_format: "v${major}.${minor}.${patch}"

      - name: Calculate Short SHA
        id: calc-sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript and build SPA
        env:
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.FIREBASE_OAUTH_CLIENT_ID }}
          VITE_APP_VERSION: "${{ steps.semver.outputs.version_tag }}+${{ steps.calc-sha.outputs.short_sha }}"
        run: npm run build

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.FIREBASE_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.CONTAINER_BUILD_SERVICE_ACCOUNT }}
          token_format: 'access_token'
          create_credentials_file: true

      - name: Docker Auth
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ vars.GCP_LOCATION }}-docker.pkg.dev # Google Artifact Registry domain
          username: 'oauth2accesstoken'
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and Push Docker Image
        id: docker-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: |
            WEB_SERVER_IMAGE=${{ vars.GCP_LOCATION }}-docker.pkg.dev/${{ vars.REPOSITORY_NAME }}/ultra-light-web-server:latest
          tags: |
            ${{ vars.GCP_LOCATION }}-docker.pkg.dev/${{ vars.REPOSITORY_NAME }}/api-keys-spa:${{ steps.semver.outputs.version_tag }}-${{ steps.calc-sha.outputs.short_sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d #v3
        with:
          service: ${{ vars.SERVICE_NAME }}
          region: ${{ vars.GCP_LOCATION }}
          image: ${{ fromJSON(steps.docker-build.outputs.metadata)['image.name'] }}
          flags: "--no-allow-unauthenticated --ingress=internal-and-cloud-load-balancing --cpu-boost --service-account=${{ secrets.CLOUD_RUN_APP_SERVICE_NAME }}"
