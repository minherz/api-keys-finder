name: Firebase Deploy

on:
  workflow_call:
    secrets:
      PRODUCTION_CLIENT_ID:
        required: true
      FIREBASE_IDENTITY_PROVIDER:
        required: true
      FIREBASE_SERVICE_ACCOUNT:
        required: true
      FIREBASE_PROJECT_ID:
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies with script mitigation
        run: npm ci --ignore-scripts

      - name: Replace Client ID in auth.ts
        run: |
          sed -i "s|const GOOGLE_OAUTH_CLIENT_ID = .*|const GOOGLE_OAUTH_CLIENT_ID = '${{ secrets.PRODUCTION_CLIENT_ID }}';|g" src/auth.ts

      - name: Run unit tests
        run: npm test

      - name: Verify TypeScript and build SPA
        run: npm run build

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.FIREBASE_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Deploy to Firebase
        uses: minherz/firebase-hosting-deploy@v1
        with:
          channelId: live
          firebaseServiceAccount: "${{ steps.auth.outputs.credentials_file_path }}"
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
