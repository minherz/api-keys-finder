name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'web/api-keys/**'
  pull_request:
    branches:
      - main
    paths:
      - 'web/api-keys/**'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/api-keys

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'web/api-keys/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript and build SPA
        run: npm run build

      - name: Run unit tests
        run: npm test
