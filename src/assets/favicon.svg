<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#CC7A00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Angled Key matching 🔑 emoji -->
  <g transform="rotate(-45 32 32)" filter="url(#shadow)">
    <!-- Extended Key Shaft -->
    <rect x="6" y="30" width="22" height="4" rx="1" fill="url(#gold)"/>
    <!-- Key Teeth attached directly to shaft -->
    <rect x="8" y="34" width="3.5" height="5.5" rx="0.5" fill="url(#gold)"/>
    <rect x="14" y="34" width="3.5" height="4" rx="0.5" fill="url(#gold)"/>
    <!-- Key Head Ring (drawn on top of the bar) -->
    <path d="M 22 32 A 10 10 0 1 1 42 32 A 10 10 0 1 1 22 32 Z M 28 32 A 4 4 0 1 0 36 32 A 4 4 0 1 0 28 32 Z" fill="url(#gold)" fill-rule="evenodd"/>
  </g>
</svg>
