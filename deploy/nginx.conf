server {
    listen 8080;

    # 1. Hashed assets (JS, CSS) can be cached by Firebase CDN forever (1 year)
    # Because if you deploy a new version, the hash name changes automatically.
    location ~* \.(?:css|js)$ {
        alias /usr/share/nginx/html/app1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 2. Never cache index.html, so users always fetch the newest release entrypoint
    location /app1 {
        alias /usr/share/nginx/html/app1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /app1/index.html;
    }
}
