server {
    listen 8080;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # 1. Hashed assets (JS, CSS) can be cached by Firebase CDN forever (1 year)
    # Because if you deploy a new version, the hash name changes automatically.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 2. Never cache index.html, so users always fetch the newest release entrypoint
    location /api-keys {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /api-keys/index.html;
    }

    # 3. NO fallback for root /
}
